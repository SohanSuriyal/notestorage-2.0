name: Apply uploaded NoteStorage update

on:
  push:
    branches:
      - main
    paths:
      - '.github/update/**'
      - '.github/workflows/apply-uploaded-update.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for complete update bundle
        id: bundle
        run: |
          if [ -f .github/update/n2000.b64 ] && [ -f .github/update/n2001.b64 ] && [ -f .github/update/n2002.b64 ] && [ -f .github/update/n2003.b64 ] && [ -f .github/update/n2004.b64 ] && [ -f .github/update/n2005.b64 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply uploaded source bundle
        if: steps.bundle.outputs.ready == 'true'
        run: |
          cat .github/update/n2000.b64 .github/update/n2001.b64 .github/update/n2002.b64 .github/update/n2003.b64 .github/update/n2004.b64 .github/update/n2005.b64 | base64 -d > /tmp/notestorage-update.tar.xz
          tar -xJf /tmp/notestorage-update.tar.xz -C .
          rm -f .github/update/n2000.b64 .github/update/n2001.b64 .github/update/n2002.b64 .github/update/n2003.b64 .github/update/n2004.b64 .github/update/n2005.b64
          rm -f .github/workflows/apply-uploaded-update.yml

      - name: Commit applied source
        if: steps.bundle.outputs.ready == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply uploaded NoteStorage update [skip ci]"
          git push
